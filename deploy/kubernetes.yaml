apiVersion: v1
kind: Namespace
metadata:
  name: formula-engine
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: formula-web
  namespace: formula-engine
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: formula-web }
  template:
    metadata:
      labels: { app: formula-web }
    spec:
      imagePullSecrets: [{ name: ghcr-pull }]
      containers:
        - name: web
          image: WEB_IMAGE
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 3
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: formula-web
  namespace: formula-engine
spec:
  selector: { app: formula-web }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: formula-web
  namespace: formula-engine
spec:
  ingressClassName: traefik
  rules:
    - host: formula-gnbiqmk095bb.r5d.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: formula-web, port: { number: 80 } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: formula-docs
  namespace: formula-engine
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: formula-docs }
  template:
    metadata:
      labels: { app: formula-docs }
    spec:
      imagePullSecrets: [{ name: ghcr-pull }]
      containers:
        - name: docs
          image: DOCS_IMAGE
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 3
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: formula-docs
  namespace: formula-engine
spec:
  selector: { app: formula-docs }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: formula-docs
  namespace: formula-engine
spec:
  ingressClassName: traefik
  rules:
    - host: formula-docs-gnbiqmk095bb.r5d.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: formula-docs, port: { number: 80 } }
